{% extends "base.html" %}
{% block title %}Changer mon mot de passe · CAO Studio{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <p><a href="{% url 'account' %}" class="text-sm text-gray-600 hover:underline dark:text-gray-300">← Mon compte</a></p>
  <div class="mt-2 border border-gray-200 bg-white p-6 shadow-sm sm:p-8 dark:border-gray-800 dark:bg-gray-900">
    <h1 class="text-2xl font-semibold tracking-tight">Changer mon mot de passe</h1>
    <form method="post" class="mt-6 space-y-5" novalidate>
      {% csrf_token %}
      {% for field in form %}
        {% include "registration/_field.html" with field=field %}
      {% endfor %}
      <button type="submit" class="inline-flex min-h-11 w-full items-center justify-center btn-accent px-4 text-base font-medium shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500">Changer le mot de passe</button>
    </form>
  </div>
</div>
{% endblock %}
