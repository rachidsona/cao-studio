{# The badge of where a job stands. #}
<span class="inline-flex shrink-0 items-center border px-2 py-0.5 text-xs font-medium whitespace-nowrap {% if status == 'quoted' %}border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-800 dark:bg-amber-950 dark:text-amber-200{% elif status == 'accepted' %}border-emerald-300 bg-emerald-50 text-emerald-800 dark:border-emerald-800 dark:bg-emerald-950 dark:text-emerald-200{% elif status == 'production' %}border-sky-300 bg-sky-50 text-sky-800 dark:border-sky-800 dark:bg-sky-950 dark:text-sky-200{% elif status == 'installed' %}border-violet-300 bg-violet-50 text-violet-800 dark:border-violet-800 dark:bg-violet-950 dark:text-violet-200{% elif status == 'lost' %}border-gray-300 bg-gray-100 text-gray-500 line-through dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400{% else %}border-gray-300 bg-white text-gray-700 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300{% endif %}" data-status="{{ status }}">{{ label }}</span>
