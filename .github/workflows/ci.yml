# Checks every push and pull request: types, frontend and backend tests, and the production build.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types, styles et build
        run: npm run build
      - name: Tests frontend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Build de l'éditeur
        run: npm run build
      - name: Parcours de bout en bout (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cao
          POSTGRES_USER: cao
          POSTGRES_PASSWORD: cao
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cao" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: cao
      POSTGRES_USER: cao
      POSTGRES_PASSWORD: cao
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "psycopg[binary]"
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Contrôles de déploiement
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
      - name: Tests backend (PostgreSQL)
        run: pytest
