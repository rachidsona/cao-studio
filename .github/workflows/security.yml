# Actions, images and tools pinned by SHA, digest or version (a moved tag would run someone else's code here);
# Dependabot (github-actions, .github/dependabot.yml) proposes their updates.
# Sécurité de CAO Studio (skill secure-application-guardian), à chaque pull request, à chaque push et chaque semaine :
# CodeQL, Semgrep, dépendances (npm audit, pip-audit), secrets (gitleaks), réglages de production (check --deploy) et
# tests de non-régression de sécurité. Le job « Barrière de sécurité » échoue si l'un d'eux échoue : c'est lui que la
# protection de branche exige avant une fusion ou un déploiement (voir .claude/skills/secure-application-guardian/IMPLEMENTATION.md).
name: Sécurité

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyse complète (rapport dans Code scanning)
        run: semgrep scan --metrics=off --config .semgrep/ --config p/owasp-top-ten --config p/django --config p/typescript --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Barrière (règles de gravité ERROR)
        run: semgrep scan --metrics=off --config .semgrep/ --config p/owasp-top-ten --config p/django --severity ERROR --error

  dependencies:
    name: Dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: npm audit (élevée et critique)
        run: npm audit --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.txt --desc

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    # On a pull request the action lists its commits (pull-requests: read); it writes no comment.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  django-deploy:
    name: Réglages de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: manage.py check --deploy
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ format('ci-check-deploy-{0}-{1}-une-cle-longue-et-propre-au-controle', github.run_id, github.run_attempt) }}
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  security-tests:
    name: Tests de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Serveur (droits, CSRF, entrées, envois, réglages)
        run: python -m pytest -q tests/backend/test_security_regressions.py tests/backend/test_catalog_pages.py tests/backend/test_sharing.py tests/backend/test_validation.py tests/backend/test_signup.py tests/backend/test_account.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Navigateur (échappement du HTML généré)
        run: npx vitest run tests/frontend/security-escaping.test.ts tests/frontend/quote-html.test.ts

  gate:
    name: Barrière de sécurité
    if: always()
    needs: [codeql, semgrep, dependencies, secrets, django-deploy, security-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Un contrôle de sécurité a échoué ou a été annulé
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Un contrôle de sécurité a échoué : ne pas fusionner ni déployer tant qu'il n'est pas corrigé (ou accepté par écrit, voir le rapport d'audit)."
          exit 1
      - name: Aucun contrôle de sécurité en échec
        run: echo "Tous les contrôles de sécurité sont passés."
